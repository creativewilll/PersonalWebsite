<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload hero image for faster LCP -->
    <link rel="preload" as="image" type="image/webp" 
          imagesrcset="/projects/headshot-hero-400.webp 400w, /projects/headshot-hero-800.webp 800w, /projects/headshot-hero-full.webp 1522w"
          imagesizes="(max-width: 640px) 240px, (max-width: 1024px) 320px, 400px"
          fetchpriority="high" />
    <!-- Music funnel hero preload -->
    <script>if(location.pathname==='/music'){var l=document.createElement('link');l.rel='preload';l.as='image';l.type='image/webp';l.imageSrcset='/music/hero-bg-sm.webp 768w, /music/hero-bg.webp 1280w';l.imageSizes='100vw';l.fetchPriority='high';document.head.appendChild(l)}</script>

    <!-- Upgrade 8: Inter font with font-display swap for no FOIT -->
    <link rel="preconnect" href="https://rsms.me" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Inter';
        font-display: swap;
        src: local('Inter');
      }
    </style>

    <!-- Calendly loaded on-demand via useCalendlyOnIdle hook; preconnect warms the CDN -->
    <link rel="preconnect" href="https://assets.calendly.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
